name: Store Package and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (without v); defaults to the latest non-prerelease GitHub release
        required: false
        type: string
      publish:
        description: Submit the validated bundle to Partner Center for certification
        required: true
        type: boolean
        default: true
      verify_access:
        description: Check federated Store API access without creating a submission
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcpspendtray-store-package
  cancel-in-progress: false

jobs:
  package:
    name: Build and optionally submit Store package
    runs-on: windows-2025
    timeout-minutes: 60
    environment: microsoft-store
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      STORE_ID: ${{ vars.STORE_ID }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Checkout packaging automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Store configuration and select immutable release
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Store Package must be dispatched from main.' }
          foreach ($name in @('STORE_ID', 'STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Configure $name on the microsoft-store environment."
              }
          }
          $release = .\tools\get-store-release.ps1 -Version $env:RELEASE_VERSION -Repository $env:GITHUB_REPOSITORY
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "source_commit=$($release.SourceCommit)" >> $env:GITHUB_OUTPUT
          "release_url=$($release.ReleaseUrl)" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$($release.Version)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          Set-Content -LiteralPath .\artifacts\store-release-notes.txt `
            -Value $release.StoreReleaseNotes -Encoding utf8NoBOM -NoNewline

      - name: Checkout exact released application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ steps.source.outputs.source_commit }}
          path: release-source
          persist-credentials: false

      - name: Install the released source's SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: release-source/global.json

      - name: Build with the Partner Center identity
        shell: pwsh
        working-directory: release-source
        run: |
          .\tools\package.ps1 -Version $env:RELEASE_VERSION `
            -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - name: Validate and stage Store artifacts
        shell: pwsh
        env:
          RELEASE_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          .\tools\stage-store-package.ps1 `
            -Bundle ".\release-source\artifacts\release\GHCPSpendTray-$env:RELEASE_VERSION.msixbundle" `
            -Version $env:RELEASE_VERSION -SourceCommit $env:RELEASE_SOURCE_COMMIT `
            -Repository $env:GITHUB_REPOSITORY -StoreId $env:STORE_ID `
            -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - name: Upload Store submission artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GHCPSpendTray-${{ steps.source.outputs.version }}-store
          path: artifacts/store/${{ steps.source.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Sign in to Store publishing identity using federation
        if: ${{ inputs.publish || inputs.verify_access }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.STORE_CLIENT_ID }}
          tenant-id: ${{ secrets.STORE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify access or submit Store update
        if: ${{ inputs.publish || inputs.verify_access }}
        shell: pwsh
        env:
          AZURE_CORE_OUTPUT: none
        run: |
          $arguments = @{
              Bundle = ".\artifacts\store\$env:RELEASE_VERSION\GHCPSpendTray-$env:RELEASE_VERSION-store.msixbundle"
              Version = $env:RELEASE_VERSION
              StoreId = $env:STORE_ID
              IdentityName = $env:STORE_IDENTITY_NAME
              Publisher = $env:STORE_PUBLISHER
              ReleaseNotesFile = '.\artifacts\store-release-notes.txt'
          }
          if ('${{ inputs.publish }}' -ne 'true') { $arguments.ValidateOnly = $true }
          .\tools\publish-store-package.ps1 @arguments

      - name: Summarize Store package
        if: ${{ always() && steps.upload.outcome == 'success' }}
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.source.outputs.release_url }}
          RELEASE_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          @"
          ## Store package
          - Source release: $env:RELEASE_URL
          - Source commit: ``$env:RELEASE_SOURCE_COMMIT``
          - Store product: ``$env:STORE_ID``
          - Store release notes are derived from the source release's What's Changed PR titles.
          - Download: $env:ARTIFACT_URL
          - Publish requested: ``${{ inputs.publish }}`` (the submission step waits for commit acceptance; check Partner Center for certification and publication).
          - Read-only API check requested: ``${{ inputs.verify_access }}``.
          - If publish was not requested, extract the artifact ZIP and upload only ``GHCPSpendTray-$env:RELEASE_VERSION-store.msixbundle`` manually.
          - This package uses the Store publisher and is intentionally unsigned. Microsoft signs it during Store publication.
          - An accepted commit starts Store processing; it does not guarantee certification or publication. On failure or timeout, inspect the existing submission before another run.
          "@ >> $env:GITHUB_STEP_SUMMARY
