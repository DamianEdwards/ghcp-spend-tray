name: Release

on:
  workflow_dispatch:
    inputs:
      windows_bump:
        description: Windows version bump from its latest non-preview release
        required: true
        type: choice
        default: Minor
        options:
          - no release
          - Major
          - Minor
          - Patch
      macos_bump:
        description: macOS version bump from its latest non-preview release
        required: true
        type: choice
        default: Minor
        options:
          - no release
          - Major
          - Minor
          - Patch
      prerelease:
        description: Mark all selected platform releases as previews
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcpspendtray-release
  cancel-in-progress: false

jobs:
  plan:
    name: Select platform versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows_release: ${{ steps.plan.outputs.windows_release }}
      windows_version: ${{ steps.plan.outputs.windows_version }}
      macos_release: ${{ steps.plan.outputs.macos_release }}
      macos_version: ${{ steps.plan.outputs.macos_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore original versions on a rerun
        if: github.run_attempt > 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan
      - name: Resolve independent platform bumps
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_BUMP: ${{ inputs.windows_bump }}
          MACOS_BUMP: ${{ inputs.macos_bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: python3 tools/release/plan.py
      - name: Preserve release plan before building or signing
        if: github.run_attempt == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.run_id }}
          path: artifacts/release-plan/plan.json
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Build, sign and publish Windows
    needs: plan
    if: needs.plan.outputs.windows_release == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.windows_version }}
      PRERELEASE: ${{ inputs.prerelease }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Checkout pinned main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate source, version, identity and signing configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release must be dispatched from main.' }
          $release = .\tools\get-release-version.ps1 -Version $env:RELEASE_VERSION
          foreach ($name in @('MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME',
              'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
              'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Configure $name on the production environment. Unsigned releases are not allowed."
              }
          }
          if ($env:MSIX_IDENTITY_NAME -eq 'GHCPSpendTray.Development' -or $env:MSIX_PUBLISHER -eq 'CN=GHCPSpendTray Development') {
              throw 'Development identity cannot be published.'
          }
          .\tools\test-release-source.ps1 -Repository $env:GITHUB_REPOSITORY -SourceCommit $env:GITHUB_SHA
          $existing = @(git tag --list 'v*')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release tags.' }
          foreach ($tag in $existing) {
              if ($tag -eq $release.Tag) {
                  $commit = git rev-list -n 1 $tag
                  if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Existing tag has a different source commit.' }
              } elseif ($tag -match '^v([0-9]+\.[0-9]+\.[0-9]+)$' -and [version]$Matches[1] -ge [version]$release.Version) {
                  throw "Release version must exceed $tag."
              }
          }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not query releases.' }
          $existingRelease = @($json | ConvertFrom-Json | ForEach-Object { $_ }) | Where-Object tag_name -eq $release.Tag
          if ($existingRelease -and -not $existingRelease.draft) { throw 'This release is already public; published assets are immutable.' }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify release source
        shell: pwsh
        run: .\tools\verify.ps1 -NativeTests
      - name: Build native bundle
        shell: pwsh
        run: |
          .\tools\package.ps1 -Version $env:RELEASE_VERSION `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME

      - name: Azure login using federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign MSIX bundle
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\release
          files-folder-filter: msixbundle
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify signature and stage release metadata
        shell: pwsh
        run: |
          $bundle = ".\artifacts\release\GHCPSpendTray-$env:RELEASE_VERSION.msixbundle"
          .\tools\test-package.ps1 -Bundle $bundle -Version $env:RELEASE_VERSION `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -RequireSigned
          Compress-Archive -Path .\artifacts\symbols\* `
            -DestinationPath ".\artifacts\release\GHCPSpendTray-$env:RELEASE_VERSION-symbols.zip"
          @{
              platform = 'windows'
              version = $env:RELEASE_VERSION
              packageVersion = "$env:RELEASE_VERSION.0"
              sourceCommit = $env:GITHUB_SHA
              releaseRunId = $env:GITHUB_RUN_ID
              identityName = $env:MSIX_IDENTITY_NAME
              publisher = $env:MSIX_PUBLISHER
              signed = $true
          } | ConvertTo-Json | Set-Content .\artifacts\release\release.json -Encoding utf8NoBOM
          Get-ChildItem .\artifacts\release -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content .\artifacts\release\SHA256SUMS -Encoding ascii
      - name: Attest signed bundle and symbols
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ./artifacts/release/*.msixbundle
            ./artifacts/release/*-symbols.zip

      - name: Tag source and stage draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $remote = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Could not query remote tag.' }
          if ($remote.Count -eq 0) {
              git tag $tag $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Could not tag source.' }
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw 'Could not publish source tag.' }
          } else {
              $remoteCommit = ($remote[0] -split '\s+')[0]
              if ($remoteCommit -ne $env:GITHUB_SHA) { throw 'Release tag changed during build.' }
          }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not query releases.' }
          $existing = @($json | ConvertFrom-Json | ForEach-Object { $_ }) | Where-Object tag_name -eq $tag
          if ($existing -and -not $existing.draft) { throw 'Refusing to overwrite a public release.' }
          if (-not $existing) {
              $arguments = @('release', 'create', $tag, '--verify-tag', '--draft', '--generate-notes', '--title', "GHCPSpendTray for Windows $env:RELEASE_VERSION")
              $previous = @(git tag --list 'v*') | Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' -and $_ -ne $tag } |
                  Sort-Object { [version]$_.Substring(1) } -Descending | Select-Object -First 1
              if ($LASTEXITCODE -ne 0) { throw 'Could not read previous Windows release tags.' }
              if ($previous) { $arguments += @('--notes-start-tag', $previous) }
              if ($env:PRERELEASE -eq 'true') { $arguments += @('--prerelease', '--latest=false') }
              & gh @arguments
              if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = @(Get-ChildItem .\artifacts\release -File | ForEach-Object FullName)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload draft assets.' }

      - name: Verify downloaded release before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = '.\artifacts\downloaded-release'
          gh release download "v$env:RELEASE_VERSION" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }
          if (@(Get-ChildItem $directory -File).Count -ne @(Get-ChildItem .\artifacts\release -File).Count) {
              throw 'Draft release contains unexpected assets; inspect it before retrying.'
          }
          foreach ($original in Get-ChildItem .\artifacts\release -File) {
              $downloaded = Join-Path $directory $original.Name
              if ((Get-FileHash -LiteralPath $original.FullName).Hash -ne (Get-FileHash -LiteralPath $downloaded).Hash) {
                  throw "Downloaded asset differs: $($original.Name)"
              }
          }
          $bundle = Join-Path $directory "GHCPSpendTray-$env:RELEASE_VERSION.msixbundle"
          .\tools\test-package.ps1 -Bundle $bundle -Version $env:RELEASE_VERSION `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -RequireSigned
          gh attestation verify $bundle --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release attestation verification failed.' }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'edit', "v$env:RELEASE_VERSION", '--draft=false')
          if ($env:PRERELEASE -eq 'true') { $arguments += @('--prerelease', '--latest=false') }
          else { $arguments += @('--prerelease=false', '--latest') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $releaseUrl = "$repositoryUrl/releases/tag/v$env:RELEASE_VERSION"
          $commitUrl = "$repositoryUrl/commit/$env:GITHUB_SHA"
          "Published signed [GHCPSpendTray $env:RELEASE_VERSION]($releaseUrl) from [``$($env:GITHUB_SHA.Substring(0, 7))``]($commitUrl)." >> $env:GITHUB_STEP_SUMMARY

  macos:
    name: Build, sign, notarize and publish macOS
    needs: plan
    if: needs.plan.outputs.macos_release == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.macos_version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout pinned main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-macos
      - name: Validate macOS version and verified main source
        run: python3 tools/macos/release.py validate "$RELEASE_VERSION"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify shared engine and universal native app
        run: bash tools/macos/verify.sh
      - name: Build release version
        run: |
          channel=Stable
          if [ "$PRERELEASE" = true ]; then channel=Preview; fi
          bash tools/macos/build.sh "$RELEASE_VERSION" "$channel"
      - name: Sign, notarize, staple and verify the application and disk image
        id: sign
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: bash tools/macos/sign-package.sh "$RELEASE_VERSION"
      - name: Retain notarization submission IDs and status
        if: ${{ always() && steps.sign.outcome != 'skipped' && steps.sign.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/macos-notarization/
          if-no-files-found: warn
          retention-days: 90
      - name: Attest notarized disk image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ./artifacts/macos-release/*.dmg
      - name: Stage draft and verify downloaded assets
        run: python3 tools/macos/release.py stage "$RELEASE_VERSION"
      - name: Publish verified macOS release
        run: |
          python3 tools/macos/release.py publish "$RELEASE_VERSION"
          echo "Published notarized [macOS $RELEASE_VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/macos-v$RELEASE_VERSION) from [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
