name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.changes.outputs.windows }}
      macos: ${{ steps.changes.outputs.macos }}
      markdown: ${{ steps.changes.outputs.markdown }}
      prompt: ${{ steps.changes.outputs.prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test platform routing
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Test release selection and retry safety
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/changes.py

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.{md,markdown}"

  prompt:
    name: Standalone Copilot prompt (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.prompt == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'
      - name: Fetch digest-verified native renderer for synthetic tests
        shell: pwsh
        run: |
          $asset, $digest = switch ($env:RUNNER_OS) {
            'Windows' { 'posh-windows-amd64.exe'; '8e7077ac1f4fb34daf62b1a25a84bf28f338f4533f13feed9b10ca6f675993b0' }
            'Linux' { 'posh-linux-amd64'; '7f345282675ab5e93edea15975642b55f3639ce5e0f0f39dfdb9fecb4c025e02' }
            'macOS' { 'posh-darwin-arm64'; '26175b7d4be75987f242cda829ff996c2da0f834ac916844251d5be646be4d6a' }
            default { throw 'Unknown renderer platform.' }
          }
          $directory = Join-Path $env:RUNNER_TEMP 'prompt-renderer'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $name = if ($IsWindows) { 'oh-my-posh.exe' } else { 'oh-my-posh' }
          $binary = Join-Path $directory $name
          Invoke-WebRequest "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v29.14.0/$asset" -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) { throw 'Renderer digest mismatch.' }
          if (!$IsWindows) { chmod 700 $binary }
          $directory | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Publish and verify Windows native helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\tools\prompt\publish.ps1 -Tests
          .\artifacts\tests\prompt\win-x64\GHCPSpendTray.PromptTests.exe --helper .\artifacts\prompt\win-x64\ghcp-spend-prompt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native helper fixtures failed.' }
          .\integrations\oh-my-posh\Test-CopilotPrompt.ps1 `
            -HelperExecutable .\artifacts\prompt\win-x64\ghcp-spend-prompt.exe `
            -FixtureExecutable .\artifacts\tests\prompt\win-x64\GHCPSpendTray.PromptTests.exe -Render
          .\tools\prompt\publish.ps1 -RuntimeIdentifier win-arm64
      - name: Publish and verify Unix native helper and system shells
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tools/prompt/publish.sh --tests
          if [[ "$RUNNER_OS" == macOS ]]; then rid=osx-arm64; else rid=linux-x64; fi
          helper="$PWD/artifacts/prompt/$rid/ghcp-spend-prompt"
          fixtures="$PWD/artifacts/tests/prompt/$rid/GHCPSpendTray.PromptTests"
          "$fixtures" --helper "$helper"
          /bin/bash integrations/oh-my-posh/Test-CopilotPrompt.bash "$helper" "$fixtures" --render
          if [[ "$RUNNER_OS" == macOS ]]; then
            /bin/zsh integrations/oh-my-posh/Test-CopilotPrompt.zsh "$helper" "$fixtures" --render
          fi
      - name: Retain standalone development bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-prompt-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/prompt/*/ghcp-spend-prompt*
            artifacts/prompt/*/CopilotPrompt.*
            artifacts/prompt/*/copilot.segment.json
            artifacts/prompt/*/demo.*
            artifacts/prompt/*/README.md
            artifacts/prompt/*/LICENSE
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Windows managed and Native AOT tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [Application, CorePlatformShared]
    env:
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache test NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-tests-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-tests-
      - name: Verify managed and Native AOT tests
        shell: pwsh
        run: .\tools\verify.ps1 -NativeTests -TestShard $env:TEST_SHARD

  package:
    name: Windows packaging and startup smoke (${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: self-contained
            store: false
            package_directory: msix
            release_directory: release
            artifact: unsigned-development-msix
          - mode: store
            store: true
            package_directory: msix-store
            release_directory: release-store
            artifact: unsigned-store-msix
    env:
      STORE_PACKAGE: ${{ matrix.store }}
      PACKAGE_DIRECTORY: ${{ matrix.package_directory }}
      RELEASE_DIRECTORY: ${{ matrix.release_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache packaging NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-package-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-package-
      - name: Build and validate both MSIX architectures
        shell: pwsh
        run: |
          $store = [bool]::Parse($env:STORE_PACKAGE)
          .\tools\package.ps1 -Store:$store
          if ($store) {
              dotnet build src\GHCPSpendTray.App\GHCPSpendTray.App.csproj -c Release -r win-x64 --nologo -v:q
              if ($LASTEXITCODE -ne 0) { throw 'Default self-contained build failed after Store publishing.' }
          }
          .\tools\test-package-deployment.ps1 -Store:$store `
            -Bundle ".\artifacts\$env:RELEASE_DIRECTORY\GHCPSpendTray-0.1.0.msixbundle" `
            -Version 0.1.0 -IdentityName GHCPSpendTray.Development -Publisher 'CN=GHCPSpendTray Development'
      - name: Launch packaged x64 smoke scenarios
        id: package_smoke
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $logDirectory = Join-Path $env:RUNNER_TEMP 'GHCPSpendTray-package-smoke'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          Start-Transcript -Path (Join-Path $logDirectory 'smoke.log')
          try {
              # Developer Mode is enabled only on this disposable hosted runner.
              $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
              New-Item -Path $unlock -Force | Out-Null
              New-ItemProperty -Path $unlock -Name AllowDevelopmentWithoutDevLicense `
                -PropertyType DWord -Value 1 -Force | Out-Null
              if ([bool]::Parse($env:STORE_PACKAGE)) {
                  $runtime = .\tools\get-windows-app-runtime.ps1 -Architecture x64
                  $installed = Get-AppxPackage -Name $runtime.Name | Where-Object {
                      $_.Architecture -eq 'X64' -and [version]$_.Version -ge [version]$runtime.MinVersion
                  }
                  if (-not $installed) { Add-AppxPackage -Path $runtime.PackagePath }
              }
              $makeappx = .\tools\get-windows-sdk-tool.ps1 -Name makeappx.exe
              $directory = $env:PACKAGE_DIRECTORY
              Write-Output "Packaged smoke: $directory"
              $layout = ".\artifacts\package-smoke-$directory"
              & $makeappx unpack /p ".\artifacts\$directory\packages\GHCPSpendTray-0.1.0-x64.msix" `
                /d $layout /o | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Cannot extract packaged smoke-test payload: $directory" }
              .\tools\smoke-test-package.ps1 -Layout $layout `
                -DiagnosticsDirectory (Join-Path $logDirectory $directory)
          }
          finally { Stop-Transcript }
      - name: Retain packaged smoke diagnostics
        if: ${{ always() && steps.package_smoke.outcome != 'skipped' && steps.package_smoke.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-diagnostics-${{ matrix.mode }}
          path: ${{ runner.temp }}/GHCPSpendTray-package-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.release_directory }}/*.msixbundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Exercise Store packaging without credentials or submission
        if: matrix.store
        shell: pwsh
        run: |
          $publisher = 'CN=11111111-1111-1111-1111-111111111111'
          .\tools\package.ps1 -Store -SkipPublish -Version 0.1.0 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'
          .\tools\stage-store-package.ps1 -Bundle .\artifacts\release-store\GHCPSpendTray-0.1.0.msixbundle `
            -Version 0.1.0 -SourceCommit $env:GITHUB_SHA -StoreId 000000000000 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'

  macos_tests:
    name: macOS 26 / Apple silicon shared tests
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache macOS NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-macos-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-macos-
      - name: Verify shared managed and Native AOT tests
        run: bash tools/macos/verify.sh --shared-tests

  macos:
    name: macOS 26 / Apple silicon app and UI
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache macOS NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-macos-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-macos-
      - name: Verify native bridge, arm64 app, platform tests and synthetic UI
        run: bash tools/macos/verify.sh --app
      - name: Archive development app
        run: ditto -c -k --keepParent artifacts/macos/GHCPSpendTray.app artifacts/macos/GHCPSpendTray-development.zip
      - name: Retain ad-hoc signed development app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-development
          path: artifacts/macos/GHCPSpendTray-development.zip
          if-no-files-found: error
          retention-days: 7

  macos_runtime:
    name: macOS 15 / Apple silicon runtime
    needs: [changes, macos]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-development
          path: artifacts/macos-runtime
      - name: Launch the release-toolchain app on older macOS without rebuilding
        run: |
          if [[ "$(uname -m)" != arm64 || "$RUNNER_ARCH" != ARM64 ]]; then
            echo "The macOS 15 runtime gate requires native Apple silicon." >&2
            exit 1
          fi
          sw_vers -productVersion
          uname -m
          ditto -x -k artifacts/macos-runtime/GHCPSpendTray-development.zip artifacts/macos-runtime
          bash tools/macos/test-package.sh artifacts/macos-runtime/GHCPSpendTray.app "$(cat packaging/macos/version.txt)"
          python3 tools/macos/smoke-test.py artifacts/macos-runtime/GHCPSpendTray.app

  verify:
    name: Verification
    needs: [changes, markdown, prompt, tests, package, macos_tests, macos, macos_runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Require all applicable checks
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./tools/assert-verification.ps1 -NeedsJson $env:NEEDS_JSON
