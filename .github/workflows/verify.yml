name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed platforms
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.changes.outputs.windows }}
      macos: ${{ steps.changes.outputs.macos }}
      markdown: ${{ steps.changes.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test platform routing
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/changes.py

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.{md,markdown}"

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify managed and Native AOT tests
        shell: pwsh
        run: .\tools\verify.ps1 -NativeTests
      - name: Build and validate both MSIX architectures
        shell: pwsh
        run: .\tools\package.ps1
      - name: Retain unsigned development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-development-msix
          path: artifacts/release/*.msixbundle
          if-no-files-found: error
          retention-days: 7
      - name: Exercise Store packaging without credentials or submission
        shell: pwsh
        run: |
          $publisher = 'CN=11111111-1111-1111-1111-111111111111'
          .\tools\package.ps1 -SkipPublish -Version 0.1.0 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'
          .\tools\stage-store-package.ps1 -Bundle .\artifacts\release\GHCPSpendTray-0.1.0.msixbundle `
            -Version 0.1.0 -SourceCommit $env:GITHUB_SHA -StoreId 000000000000 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'

  macos:
    name: macOS (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify shared engine, native bridge, universal app and synthetic UI
        run: bash tools/macos/verify.sh
      - name: Archive development app
        if: matrix.runner == 'macos-15'
        run: ditto -c -k --keepParent artifacts/macos/GHCPSpendTray.app artifacts/macos/GHCPSpendTray-development.zip
      - name: Retain ad-hoc signed development app
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-development
          path: artifacts/macos/GHCPSpendTray-development.zip
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verification
    needs: [changes, markdown, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all relevant checks
        env:
          CHANGES: ${{ needs.changes.result }}
          WINDOWS_NEEDED: ${{ needs.changes.outputs.windows }}
          MACOS_NEEDED: ${{ needs.changes.outputs.macos }}
          MARKDOWN_NEEDED: ${{ needs.changes.outputs.markdown }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          MARKDOWN: ${{ needs.markdown.result }}
        run: |
          python3 - <<'PY'
          import os
          assert os.environ["CHANGES"] == "success", "Change detection failed"
          for platform in ("WINDOWS", "MACOS", "MARKDOWN"):
              if os.environ[platform + "_NEEDED"] == "true":
                  assert os.environ[platform] == "success", platform + " checks failed"
          PY
