name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection and Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_validation: ${{ steps.changes.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether source changed
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            'run_validation=true' >> $env:GITHUB_OUTPUT
            'lint_markdown=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:BASE_SHA -eq ('0' * 40)) {
            $paths = @(git ls-files)
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $paths = @(git diff --no-renames --name-only "$env:BASE_SHA...$env:HEAD_SHA")
          } else {
            $paths = @(git diff --no-renames --name-only $env:BASE_SHA $env:HEAD_SHA)
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect changed files.' }
          $runValidation = @($paths | Where-Object { $_ -notmatch '\.(md|markdown)$' }).Count -gt 0
          $lintMarkdown = @($paths | Where-Object { $_ -match '\.(md|markdown)$' }).Count -gt 0
          "run_validation=$($runValidation.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "lint_markdown=$($lintMarkdown.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Lint Markdown
        if: steps.changes.outputs.lint_markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.{md,markdown}"

  tests:
    name: Managed and Native AOT tests
    needs: changes
    if: needs.changes.outputs.run_validation == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache test NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-tests-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-tests-
      - name: Verify managed and Native AOT tests
        shell: pwsh
        run: .\tools\verify.ps1 -NativeTests

  package:
    name: Packaging and startup smoke
    needs: changes
    if: needs.changes.outputs.run_validation == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache packaging NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-package-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-package-
      - name: Build and validate both MSIX architectures
        shell: pwsh
        run: .\tools\package.ps1
      - name: Launch packaged x64 smoke scenarios
        id: package_smoke
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $logDirectory = Join-Path $env:RUNNER_TEMP 'GHCPSpendTray-package-smoke'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          Start-Transcript -Path (Join-Path $logDirectory 'smoke.log')
          try {
              # Developer Mode is enabled only on this disposable hosted runner.
              $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
              New-Item -Path $unlock -Force | Out-Null
              New-ItemProperty -Path $unlock -Name AllowDevelopmentWithoutDevLicense `
                -PropertyType DWord -Value 1 -Force | Out-Null
              $makeappx = .\tools\get-windows-sdk-tool.ps1 -Name makeappx.exe
              $layout = '.\artifacts\package-smoke-layout'
              & $makeappx unpack /p .\artifacts\msix\packages\GHCPSpendTray-0.1.0-x64.msix `
                /d $layout /o | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Cannot extract packaged smoke-test payload.' }
              .\tools\smoke-test-package.ps1 -Layout $layout
          }
          finally { Stop-Transcript }
      - name: Retain packaged smoke diagnostics
        if: ${{ always() && steps.package_smoke.outcome != 'skipped' && steps.package_smoke.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-diagnostics
          path: ${{ runner.temp }}/GHCPSpendTray-package-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-development-msix
          path: artifacts/release/*.msixbundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Exercise Store packaging without credentials or submission
        shell: pwsh
        run: |
          $publisher = 'CN=11111111-1111-1111-1111-111111111111'
          .\tools\package.ps1 -SkipPublish -Version 0.1.0 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'
          .\tools\stage-store-package.ps1 -Bundle .\artifacts\release\GHCPSpendTray-0.1.0.msixbundle `
            -Version 0.1.0 -SourceCommit $env:GITHUB_SHA -StoreId 000000000000 `
            -IdentityName GHCPSpendTray.StoreTest -Publisher $publisher -PublisherDisplayName 'Store Test'

  verify:
    name: Verification
    needs: [changes, tests, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Require all applicable checks
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./tools/assert-verification.ps1 -NeedsJson $env:NEEDS_JSON
