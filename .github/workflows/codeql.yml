name: CodeQL

on:
  schedule:
    - cron: '37 10 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
          - language: csharp
            runner: ubuntu-24.04
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          - language: python
            runner: ubuntu-24.04
            build-mode: none
          # Bridge.h contains declarations only, not a separate C/C++ implementation.
          # Trace the real Swift build; there is no Xcode project or Swift package.
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Select Apple toolchain
        if: matrix.language == 'swift'
        uses: ./.github/actions/setup-macos
      - name: Install pinned SDK for the native bridge
        if: matrix.language == 'swift' || matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift frontend and Native AOT bridge
        if: matrix.language == 'swift'
        run: |
          bash tools/macos/build.sh
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors \
            tools/macos/update-crypto.swift -o artifacts/sparkle/update-crypto
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
