name: Windows storage benchmark

on:
  workflow_dispatch:
  # Allows the experiment to run before this workflow exists on main.
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/windows-storage-benchmark.yml
      - tools/windows-storage-benchmark.ps1

permissions:
  contents: read

concurrency:
  group: windows-storage-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.workload }} / ${{ matrix.order }} / sample ${{ matrix.sample }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workload: [Tests, Packaging]
        order: [baseline-first, relocated-first]
        sample: [1, 2]
    env:
      STORAGE_WORKLOAD: ${{ matrix.workload }}
      STORAGE_ORDER: ${{ matrix.order }}
      STORAGE_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Compare cold and warm caches on the same runner
        shell: pwsh
        run: |
          .\tools\windows-storage-benchmark.ps1 -Phase Compare -Workload $env:STORAGE_WORKLOAD -Order $env:STORAGE_ORDER
      - name: Retain timings and storage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-${{ matrix.workload }}-${{ matrix.order }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/storage-benchmark/
          if-no-files-found: error
          retention-days: 14
