name: Set up Windows build storage
description: Keep temporary files and NuGet caches on the runner workspace disk.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $root = Join-Path $env:RUNNER_TEMP 'build-caches'
        foreach ($entry in @{
            TEMP = 'temp'
            TMP = 'temp'
            NUGET_PACKAGES = 'nuget\packages'
            NUGET_HTTP_CACHE_PATH = 'nuget\http-cache'
            NUGET_SCRATCH = 'nuget\scratch'
            NUGET_PLUGINS_CACHE_PATH = 'nuget\plugins-cache'
        }.GetEnumerator()) {
            $path = Join-Path $root $entry.Value
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            "$($entry.Key)=$path" >> $env:GITHUB_ENV
        }
